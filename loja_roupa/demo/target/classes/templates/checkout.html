<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Checkout - RocketStore</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow-lg border-0 p-5" style="border-radius: 20px;">
                    <h2 class="fw-bold mb-4 text-center">Resumo do Pedido 🚀</h2>
                    
                    <div class="table-responsive mb-4">
                        <table class="table align-middle text-center">
                            <thead class="table-dark">
                                <tr>
                                    <th>Produto</th>
                                    <th>Tamanho</th>
                                    <th>Preço</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="item : ${cart}">
                                    <td th:text="${item.name}">Camiseta</td>
                                    <td><span class="badge bg-secondary" th:text="${item.size}">M</span></td>
                                    <td class="fw-bold" th:text="'R$ ' + ${#numbers.formatDecimal(item.price, 1, 2)}">0,00</td>
                                </tr>
                            </tbody>
                            <tfoot class="table-group-divider">
                                <tr class="fs-4">
                                    <td colspan="2" class="text-end fw-bold">Total do Pedido:</td>
                                    <td class="text-primary fw-bold" th:text="'R$ ' + ${#numbers.formatDecimal(total, 1, 2)}">0,00</td>
                                </tr>
                            </tfoot>
                        </table>
                    </div>

                    <div class="d-grid gap-2">
                        <form th:action="@{/cart/checkout}" method="post">
                            <button type="submit" class="btn btn-success btn-lg w-100 fw-bold py-3 shadow">
                                Confirmar e Finalizar Compra
                            </button>
                        </form>
                        <a href="/cart" class="btn btn-link text-muted mt-2">Corrigir algo no carrinho</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
