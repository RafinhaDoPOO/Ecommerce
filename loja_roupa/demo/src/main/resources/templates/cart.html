<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Meu Carrinho - Loja Rocket</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    <div class="container py-5">
        <h2 class="mb-4 fw-bold">Seu Carrinho</h2>
        
        <div class="row">
            <div class="col-md-8">
                <div th:if="${#lists.isEmpty(cart)}" class="alert alert-info">
                    Seu carrinho está vazio. <a href="/products/list">Voltar às compras?</a>
                </div>
                
                <div th:each="item : ${cart}" class="card mb-3 shadow-sm border-0">
                    <div class="row g-0 align-items-center">
                        <div class="col-md-2 p-2">
                            <img th:src="${item.imageUrl}" class="img-fluid rounded" alt="Produto">
                        </div>
                        <div class="col-md-6 p-3">
                            <h5 class="fw-bold mb-0" th:text="${item.name}">Nome</h5>
                            <small class="text-muted" th:text="'Tamanho: ' + ${item.size}">M</small>
                        </div>
                        <div class="col-md-4 p-3 text-end">
                            <span class="fs-5 fw-bold text-primary" th:text="'R$ ' + ${item.price}">R$ 0,00</span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card p-4 shadow-sm border-0" style="border-radius: 15px;">
                    <h4 class="fw-bold mb-4">Resumo</h4>
                    <div class="d-flex justify-content-between mb-3">
                        <span>Subtotal:</span>
                        <span class="fw-bold" th:text="'R$ ' + ${total}">R$ 0,00</span>
                    </div>
                    <hr>
                    <button class="btn btn-success btn-lg w-100 mb-2">Finalizar Pedido</button>
                    <a href="/cart/clear" class="btn btn-outline-danger w-100">Esvaziar Carrinho</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
