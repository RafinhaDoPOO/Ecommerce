<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cadastro - RocketStore</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light d-flex align-items-center" style="min-height: 100vh;">

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-lg border-0 p-5">
                <h2 class="text-center fw-bold mb-4">Criar Conta</h2>
                
                <form th:action="@{/register}" method="post">
                    <div class="mb-3">
                        <label class="form-label fw-bold">E-mail</label>
                        <input type="email" name="email" class="form-control" required>
                    </div>
                    
                    <div class="mb-4">
                        <label class="form-label fw-bold">Senha</label>
                        <input type="password" name="password" class="form-control" required>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 fw-bold py-2">Cadastrar</button>
                </form>
                
                <div class="text-center mt-3">
                    <a href="/login" class="text-decoration-none">Já tem conta? Faça login</a>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
