<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Loja Rocket</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
    <div class="container">
        <div class="card">
            <h2>Cadastrar Roupa</h2>

            <form th:action="@{/api/products}" th:object="${product}" method="post" enctype="multipart/form-data">
                
                <div class="mb-3">
                    <label class="form-label">Nome da Peça</label>
                    <input type="text" th:field="*{name}" class="form-control" placeholder="Ex: Camiseta Tom & Jerry">
                </div>

                <div class="mb-3">
                    <label class="form-label">Preço (R$)</label>
                    <input type="number" step="0.01" th:field="*{price}" class="form-control" placeholder="0,00">
                </div>

                <div class="mb-3">
                    <label class="form-label">Quantidade</label>
                    <input type="number" th:field="*{qty_stock}" class="form-control" placeholder="Quantidade em estoque">
                </div>

                <div class="mb-3">
                    <label class="form-label">Tamanhos (separe por vírgula)</label>
                    <input type="text" th:field="*{size}" class="form-control" placeholder="P, M, G, GG">
                </div>

                <div class="mb-3">
                    <label class="form-label">Descrição da Estampa</label>
                    <textarea th:field="*{description}" class="form-control" rows="3" placeholder="Detalhes sobre a blusa..."></textarea>
                </div>

                <div class="mb-3">
                    <label class="form-label">Foto da Estampa</label>
                    <input type="file" name="imageFile" id="imageInput" class="form-control" accept="image/*">
                    
                    <div id="previewContainer" class="mt-3 text-center" style="display: none;">
                        <img id="imagePreview" src="#" alt="Preview" style="max-width: 100%; border-radius: 0.5rem; margin-top: 10px;">
                    </div>
                </div>

                <button type="submit" class="btn-primary">Salvar no Inventário</button>
            </form>
        </div>
    </div>

    <script>
        const imageInput = document.getElementById('imageInput');
        const imagePreview = document.getElementById('imagePreview');
        const previewContainer = document.getElementById('previewContainer');

        imageInput.onchange = evt => {
            const [file] = imageInput.files;
            if (file) {
                imagePreview.src = URL.createObjectURL(file);
                previewContainer.style.display = 'block';
            }
        }
    </script>
</body>
</html>
