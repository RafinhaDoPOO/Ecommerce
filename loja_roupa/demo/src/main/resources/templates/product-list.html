<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Catálogo - Loja Rocket</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body { background-color: #f8f9fa; padding-top: 20px; } /* Ajuste de respiro */
        
        .product-card {
            transition: all 0.3s ease;
            border-radius: 15px !important;
            background: #fff;
            border: none;
        }

        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.08) !important;
        }

        .img-container {
            height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: #fff;
            border-radius: 15px 15px 0 0;
            overflow: hidden;
        }

        .product-img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        
        /* Garante que o conteúdo não fique sob a navbar fixa */
        .main-content { margin-top: 80px; }
    </style>
</head>
<body>

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="container main-content py-5">
        <h2 class="text-center mb-5 fw-bold">Nossas Camisetas</h2>
        
        <div class="row justify-content-center mb-5">
            <div class="col-md-8">
                <form th:action="@{/products/list}" method="get" class="d-flex gap-2 p-2 bg-white shadow-sm rounded-pill px-4">
                    <input type="text" name="search" class="form-control border-0 shadow-none" 
                           placeholder="Buscar blusa..." th:value="${param.search}">
                    <button type="submit" class="btn btn-primary rounded-pill px-4 fw-bold">Buscar</button>
                    <a href="/products/list" class="btn btn-link text-muted text-decoration-none">Limpar</a>
                </form>
            </div>
        </div>

        <div class="row row-cols-1 row-cols-md-3 g-4">
            <div class="col" th:each="p : ${products}">
                <div class="card h-100 product-card shadow-sm">
                    <a th:href="@{/products/{id}(id=${p.id})}" class="img-container">
                        <img th:src="${p.imageUrl != null ? p.imageUrl : 'https://via.placeholder.com/300'}" 
                             class="product-img" alt="Imagem do produto">
                    </a>
                    <div class="card-body text-center">
                        <h5 class="card-title fw-bold" th:text="${p.name}">Nome</h5>
                        <p class="card-text text-primary fs-5 fw-bold mb-1" th:text="'R$ ' + ${p.price}">R$ 0,00</p>
                        <p class="card-text small text-muted">Estoque: <span th:text="${p.qty_stock}">0</span> unidades</p>
                    </div>
                </div>
            </div>
        </div>

        <div class="text-center mt-5">
    <hr class="mb-5">
    <a href="/products/new" class="btn btn-outline-dark btn-lg px-5">Cadastrar Nova Peça</a>
</div>
    </main>

</body>
</html>
